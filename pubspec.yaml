name: vibetube
description: VibeTube - YouTube Premium Features Unlocked
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  
  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5
  
  # State Management
  provider: ^6.1.2
  
  # Network
  http: ^1.2.2
  
  # Storage
  shared_preferences: ^2.3.3
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
