name: Build & Release VibeTube

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          BUILD_DATE=$(date +'%Y-%m-%d')
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeTube-debug-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeTube-release-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Copy APK to docs
        run: |
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/VibeTube-debug.apk
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk docs/download/VibeTube-release.apk
          fi

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: VibeTube-debug-*
          path: release/

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: VibeTube-release-*
          path: release/
        continue-on-error: true

      - name: List release files
        run: ls -la release/

      - name: Generate Checksums
        run: |
          cd release
          for file in *.apk; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.apk
            release/*.sha256
          body: |
            ## 🎬 VibeTube ${{ github.ref_name }}
            
            ### ✨ What's New
            - Ad-Free YouTube Experience
            - Background Playback
            - Picture-in-Picture (PiP)
            - Video Downloads (144p - 4K)
            - SponsorBlock Integration
            - Return YouTube Dislike
            - Dark Mode
            - Playback Speed Control (0.25x - 3x)
            
            ### 📱 Download
            - **VibeTube-release.apk** - Optimized release build
            - **VibeTube-debug.apk** - Debug build with logging
            
            ### 🔧 Requirements
            - Android 7.0 (API 24) or higher
            - ~15 MB storage space
            
            ### 📦 Installation
            1. Download the APK file
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install
            4. Enjoy YouTube Premium features!
            
            ### 🛡️ Permissions Required
            - Internet - Stream videos
            - Storage - Download videos
            - Background Play - Play with screen off
            
            ---
            *Built with ❤️ by BlazeNext*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release page
        if: success()
        run: |
          echo "Release ${{ github.ref_name }} created successfully!"
