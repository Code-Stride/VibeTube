name: Build Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode release keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBETUBE_KEYSTORE_BASE64 }}
          VIBETUBE_STORE_PASSWORD: ${{ secrets.VIBETUBE_STORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.VIBETUBE_EXPECTED_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VIBETUBE_KEYSTORE_BASE64 secret is not set."
            echo "Add it with: base64 -w0 vibetube-release.jks"
            exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::VIBETUBE_EXPECTED_CERT_SHA256 is required for tagged releases."
              exit 1
            fi
            echo "::warning::Signing fingerprint allow-list is not configured; set VIBETUBE_EXPECTED_CERT_SHA256."
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vibetube-release.jks
          # Confirm the keystore decoded and the password opens it, without
          # printing any secret material into the log.
          keytool -list -keystore android/app/vibetube-release.jks \
            -storepass "$VIBETUBE_STORE_PASSWORD" > /dev/null
          ACTUAL_CERT_SHA256="$(keytool -list -v \
            -keystore android/app/vibetube-release.jks \
            -storepass "$VIBETUBE_STORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -n1 \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" \
              | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            if [ -z "$ACTUAL_CERT_SHA256" ] || \
               [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Release signing certificate fingerprint mismatch."
              exit 1
            fi
            echo "Keystore decoded and certificate allow-list verified."
          else
            echo "Keystore decoded and password verified."
          fi

      - name: Build signed release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Gradle reads these in signingConfigs.release. No fallbacks: a
          # missing secret must fail the build rather than silently produce
          # an unsigned or debug-signed APK.
          VIBETUBE_STORE_PASSWORD: ${{ secrets.VIBETUBE_STORE_PASSWORD }}
          VIBETUBE_KEY_ALIAS: ${{ secrets.VIBETUBE_KEY_ALIAS }}
          VIBETUBE_KEY_PASSWORD: ${{ secrets.VIBETUBE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build debug APK for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: flutter build apk --debug

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/VibeTube-release.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/VibeTube-debug.apk
          fi
          ls -lah dist/

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/vibetube-release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VibeTube-Flutter-APK
          path: dist/VibeTube-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only in this repo, which made
    # action-gh-release fail with "Resource not accessible by integration"
    # (403). Creating a release and uploading the APK needs contents: write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need tags to work out the previous release for the compare link.
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VibeTube-Flutter-APK
          path: release/

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Previous tag by version order, so the compare link is meaningful.
          PREV=$(git tag --sort=-v:refname | grep -A1 -x "$TAG" | tail -1)
          if [ "$PREV" = "$TAG" ]; then PREV=""; fi
          echo "Building notes for $TAG (previous: ${PREV:-none})"
          if python3 scripts/release_notes.py "$TAG" \
               ${PREV:+--previous "$PREV"} > release-notes.md; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "----- release notes -----"
            cat release-notes.md
          else
            # No CHANGELOG entry: fall back to autogenerated notes rather
            # than publishing an empty release body.
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG entry for $TAG; using autogenerated notes."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*.apk
          body_path: ${{ steps.notes.outputs.generated == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.generated != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
