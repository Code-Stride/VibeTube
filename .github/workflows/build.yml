name: Build Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -alias vibetube -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=VibeTube, OU=BlazeNXT, O=BlazeNXT, L=India, ST=India, C=IN"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTube-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: VibeTube-Flutter-APK
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.apk
          body: |
            ## 🎬 VibeTube ${{ github.ref_name }}
            
            ### ✨ Premium Features Unlocked
            - 🚫 Ad-Free Experience
            - 🎵 Background Playback
            - 📺 Picture-in-Picture (PiP)
            - ⬇️ Video Downloads
            - ⏭️ SponsorBlock Integration
            - 👎 Return YouTube Dislike
            
            ### 📱 Built with Flutter
            *Made with ❤️ by BlazeNXT*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
