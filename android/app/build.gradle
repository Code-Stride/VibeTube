plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseStoreFile = file("vibetube-release.jks")
def ciStoreFile = file("keystore.jks")
def storeToUse = releaseStoreFile.exists() ? releaseStoreFile : (ciStoreFile.exists() ? ciStoreFile : null)

android {
    namespace "com.blazenxt.vibetube"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.blazenxt.vibetube"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "1.5.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (storeToUse != null) {
                storeFile storeToUse
                storePassword "vibetube2026"
                keyAlias "vibetube"
                keyPassword "vibetube2026"
            }
        }
    }

    buildTypes {
        release {
            if (storeToUse != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source "../.."
}
