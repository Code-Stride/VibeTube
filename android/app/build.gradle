plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseStoreFile = file("vibetube-release.jks")
def ciStoreFile = file("keystore.jks")
def storeToUse = releaseStoreFile.exists() ? releaseStoreFile : (ciStoreFile.exists() ? ciStoreFile : null)
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

android {
    namespace "com.blazenxt.vibetube"
    // AndroidX (androidx.core 1.17, androidx.browser 1.9) requires compiling
    // against API 36; staying on 35 fails :app:checkReleaseAarMetadata.
    // compileSdk only controls which APIs are visible — targetSdk below still
    // governs runtime behaviour, so this is a safe bump.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.blazenxt.vibetube"
        minSdk 24
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (storeToUse != null) {
                storeFile storeToUse
                // Credentials loaded from gradle.properties or CI/CD environment variables
                // NEVER hardcode secrets here. See gradle.properties.example
                storePassword findProperty('VIBETUBE_STORE_PASSWORD') ?: System.getenv('VIBETUBE_STORE_PASSWORD') ?: ''
                keyAlias findProperty('VIBETUBE_KEY_ALIAS') ?: System.getenv('VIBETUBE_KEY_ALIAS') ?: ''
                keyPassword findProperty('VIBETUBE_KEY_PASSWORD') ?: System.getenv('VIBETUBE_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            if (storeToUse != null) {
                signingConfig signingConfigs.release
            } else if (releaseRequested) {
                throw new GradleException("Release keystore is missing; refusing to produce a debug-signed release APK")
            }
            // Was disabled: the release APK shipped ~30-40% larger with no
            // obfuscation at all. proguard-rules.pro keeps the Flutter
            // embedding and our MethodChannel/Service entry points.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source "../.."
}
