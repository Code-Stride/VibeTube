allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        sub.android {
            compileSdkVersion 36
        }
    }
    sub.plugins.withId("com.android.application") {
        sub.android {
            compileSdkVersion 36
        }
    }
    // Fallback for plugins applied later
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin("com.android.library") || sub.plugins.hasPlugin("com.android.application")) {
            def androidExt = sub.extensions.findByName("android")
            if (androidExt != null) {
                try {
                    androidExt.compileSdkVersion(36)
                } catch (Throwable ignored) {
                    try {
                        androidExt.compileSdk = 36
                    } catch (Throwable ignored2) {}
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
